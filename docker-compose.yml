services:
  vulnerable-app:
    build: ./app
    container_name: lab09-vulnerable-app
    ports:
      - "8080:8080"
    environment:
      - FLASK_DEBUG=false
      - DB_USER=${DB_USER:-appuser}
      - DB_PASSWORD=${DB_PASSWORD:-}
    restart: unless-stopped

networks:
  default:
    name: lab09-net
