rules:
  # ===========================================================================
  # 1. SQL-инъекция — f-строка / конкатенация в execute()
  # ===========================================================================
  - id: py-sql-injection
    languages: [python]
    severity: ERROR
    message: >-
      Возможная SQL-инъекция: SQL-запрос строится через f-строку или
      конкатенацию с пользовательским вводом и передаётся в execute().
      Используйте параметризованные запросы: cursor.execute(query, (param,)).
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          - pattern: $CUR.execute(f"...{$X}...")
          - pattern: $CUR.execute("..." + $X)
          - pattern: |
              $Q = f"...{$X}..."
              ...
              $CUR.execute($Q)

  # ===========================================================================
  # 2. Жёстко заданный секрет (hardcoded credentials)
  # ===========================================================================
  - id: py-hardcoded-credentials
    languages: [python]
    severity: ERROR
    message: >-
      Захардкоженный секрет / учётные данные. Секреты должны храниться в
      переменных окружения, vault или secrets manager — не в исходном коде.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-either:
      - pattern: DB_PASSWORD = "..."
      - pattern: DB_USER = "..."
      - pattern: SECRET_KEY = "..."
      - pattern: API_KEY = "..."
      - pattern: JWT_SECRET = "..."
      - pattern: PASSWORD = "..."

  # ===========================================================================
  # 3. Небезопасный eval / exec на пользовательском вводе
  # ===========================================================================
  - id: py-unsafe-eval
    languages: [python]
    severity: ERROR
    message: >-
      Использование eval() / exec() — критическая уязвимость, ведущая к RCE,
      если в выражение попадает пользовательский ввод. Замените на
      ast.literal_eval или ограниченный вычислитель.
    metadata:
      category: security
      cwe: "CWE-95: Eval Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  # ===========================================================================
  # 4. Command injection через os.system / subprocess
  # ===========================================================================
  - id: py-command-injection
    languages: [python]
    severity: ERROR
    message: >-
      Командная инъекция: команда ОС строится из пользовательского ввода и
      передаётся в shell. Используйте список аргументов без shell и
      валидируйте вход.
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: os.system(...)
      - pattern: subprocess.call(["sh", "-c", ...])
      - pattern: subprocess.call(["bash", "-c", ...])
      - pattern: |
          $CMD = ["sh", "-c", ...]
          ...
          subprocess.call($CMD)
      - pattern: subprocess.run(..., shell=True)

  # ===========================================================================
  # 5. Небезопасная десериализация pickle
  # ===========================================================================
  - id: py-insecure-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Небезопасная десериализация: pickle.loads() на данных, которые могут
      контролироваться атакующим, ведёт к RCE. Используйте json или
      проверенные форматы.
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  # ===========================================================================
  # 6. Path Traversal — open() на пользовательском пути
  # ===========================================================================
  - id: py-path-traversal
    languages: [python]
    severity: WARNING
    message: >-
      Path traversal: файл открывается по пути из пользовательского ввода без
      нормализации. Атакующий может прочитать произвольный файл (../../etc/passwd).
      Валидируйте и ограничивайте путь безопасной директорией.
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"
      owasp: "A01:2021 - Broken Access Control"
    patterns:
      - pattern: |
          $P = request.args.get(...)
          ...
          open($P, ...)

  # ===========================================================================
  # 7. Reflected XSS — вывод user-input в HTML без экранирования
  # ===========================================================================
  - id: py-reflected-xss
    languages: [python]
    severity: WARNING
    message: >-
      Reflected XSS: пользовательский ввод подставляется в HTML без
      экранирования. Используйте markupsafe.escape() или шаблоны с
      автоэкранированием.
    metadata:
      category: security
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern: |
          $H = f"<...>{$X}</...>"
          ...
          return make_response($H, ...)

  # ===========================================================================
  # 8. Flask debug=True
  # ===========================================================================
  - id: py-flask-debug-enabled
    languages: [python]
    severity: WARNING
    message: >-
      Flask debug-режим раскрывает интерактивный отладчик Werkzeug, через
      который возможен RCE. Никогда не включайте в production.
    metadata:
      category: security
      cwe: "CWE-489: Active Debug Code"
    pattern-either:
      - pattern: app.run(..., debug=True)
      - pattern: app.config["DEBUG"] = True
      - pattern: app.debug = True
