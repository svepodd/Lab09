name: DevSecOps Pipeline

on:
  push:
    branches: [develop, main, svepodd_lab09]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: lab09-app
  APP_PORT: 8080

jobs:

  sast:
    name: "SAST — Semgrep + Checkov"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install semgrep checkov

      - name: Semgrep scan
        run: |
          semgrep \
            --config pipeline/sast/semgrep-rules.yml \
            --json \
            --output pipeline/sast/semgrep-report.json \
            app/ || true

      - name: Checkov scan
        run: |
          checkov \
            --framework dockerfile \
            --file app/Dockerfile \
            --output json \
            --output-file-path pipeline/sast/checkov-dockerfile-report.json \
            --soft-fail || true

          checkov \
            --framework docker_compose \
            --file docker-compose.yml \
            --output json \
            --output-file-path pipeline/sast/checkov-compose-report.json \
            --soft-fail || true

      - uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: pipeline/sast/

  sca:
    name: "SCA — Dependency-Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "lab09-vulnerable-app"
          path: "app"
          format: "JSON"
          out: "pipeline/sca"
          # --failOnCVSS 9: упасть при CVE с CVSS >= 9 (Critical)
          # --enableExperimental: включить анализатор Python
          args: >-
            --failOnCVSS 9
            --enableExperimental

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-reports
          path: pipeline/sca/

  build-and-scan:
    name: "Build + Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} app/

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "json"
          output: "pipeline/trivy-report.json"
          severity: "HIGH,CRITICAL"
          # exit-code "0" — режим аудита; "1" — блокирующий gate
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: "os,library"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: pipeline/trivy-report.json

  dast:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-and-scan
    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:${{ env.APP_PORT }} && break
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          rules_file_name: "pipeline/dast/zap-baseline.conf"
          cmd_options: "-J zap-report.json -r zap-report.html"
          fail_action: false

      - name: Collect ZAP report
        if: always()
        run: |
          mkdir -p pipeline/dast/out
          cp zap-report.json pipeline/dast/out/ 2>/dev/null || true
          cp zap-report.html pipeline/dast/out/ 2>/dev/null || true

      - name: Stop application
        if: always()
        run: docker compose down

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-reports
          path: pipeline/dast/out/

  report:
    name: "Unified Report"
    runs-on: ubuntu-latest
    needs: [sast, sca, build-and-scan, dast]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: pipeline/artifacts/

      - name: Normalize ZAP report name
        run: |
          # download-artifact кладёт zap-report.json внутрь dast-reports/
          find pipeline/artifacts -name "zap-report.json" -exec cp {} pipeline/artifacts/ \; || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jinja2

      - name: Merge reports
        run: python pipeline/merge_reports.py

      - uses: actions/upload-artifact@v4
        with:
          name: unified-report
          path: pipeline/unified-report.html
